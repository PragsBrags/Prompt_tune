run:
  mode: evaluate                  # evaluate | train | index
  seed: 42
  output_dir: ../output/gguf_model/Qwen
  adapter_dir: ../output/adapter/Qwen
  merged_dir: ../output/merged/Qwen


wandb:
  project: ilprl-tamang-translation
  entity: null             # Set this only if your team uses a W&B entity.
  mode: online             # online | offline | disabled
  group: qwen3.5-4b-qlora

model:
  source: merged                    # base | merged
  name: Qwen/Qwen3.5-4B
  model_path: ../output/merged/Qwen
  quantization:
    enabled: True
    load_in_4bit: True
  thinking: False
  max_seq_length: 256

eval_data:
  dataset_name: ../dataset/eval_split.csv
  split: train
  revision: main
  shuffle: False
  batch_size: 8
  model_output: ../output/eval_results

  directions:
  - dataset_config: eval_split.csv
    source_column: translation_tmg
    target_column: translation_en
    source_language: Tamang
    target_language: English

train_data:
  dataset_name: ../dataset/train_split.csv
  split: train
  revision: null
  shuffle: True
  max_samples: 

  directions:
    # Tamang to English
    - dataset_config: train_split.csv
      source_column: translation_tmg
      target_column: translation_en
      source_language: Tamang
      target_language: English

    # English to Tamang
    - dataset_config: train_split.csv
      source_column: translation_en
      target_column: translation_tmg
      source_language: English
      target_language: Tamang

    # Nepali to Tamang
    - dataset_config: train_split.csv
      source_column: relevant_sentences
      target_column: translation_tmg
      source_language: Nepali
      target_language: Tamang

    # Tamang to Nepali
    - dataset_config: train_split.csv
      source_column: translation_tmg
      target_column: relevant_sentences
      source_language: Tamang
      target_language: Nepali


prompt:
  strategy: zero_shot             # zero_shot | few_shot | COT | rag_few_shot | cot_translation | back_translation
  direction: en_np
  examples:
    en_np:
      - source: Good morning.
        target: शुभ प्रभात।

      - source: How are you?
        target: तपाईंलाई कस्तो छ?

      - source: Thank you very much.
        target: धेरै धेरै धन्यवाद।

    en_tmg:
      - source: 
        target: 

      - source: 
        target: 

      - source: 
        target: 
    
    np_en:
      - source: 
        target: 

      - source: 
        target: 

      - source: 
        target: 
    
    np_tmg:
      - source: 
        target: 

      - source: 
        target: 

      - source: 
        target: 

    tmg_np:
      - source: 
        target: 

      - source: 
        target: 

      - source: 
        target: 

    tmg_en:
      - source: 
        target: 

      - source: 
        target: 

      - source: 
        target: 

rag:
  index_path: ../embeddging_index
  rebuild: False
  embedding_model: sentence-transformers/all-MiniLM-L6-v2
  index_batch_size: 64

  top_k: 3
  candidate_k: 6
  collection_name: translation_embeddings

training:
  method: qlora
  completion_loss: True
  output_dir: ../output/adapter/Qwen
  learning_rate: 0.0001
  num_train_epochs: 1
  lora_rank: 16
  lora_alpha: 32
  lora_dropout: 0.05
  batch_size: 2
  gradient_accumulation_steps: 4
  warmup_steps: 50
  logging_steps: 10
  optim: adamw_8bit
