# Project configuration for the Tamang translation pipeline.
# Path convention: run `cd src; python cli.py`; all relative paths below resolve from src.

run:
  # Pipeline stage. Valid values: train | evaluate | index (build Chroma).
  mode: evaluate
  # Integer random seed for model, dataset sampling, and shuffling.
  seed: 42
  # Writable destination for this model's GGUF Q4_K_M export; used only by train.
  output_dir: ../output/gguf_model/${model.name}
  # Writable destination for this model's PEFT/LoRA adapter and tokenizer; used only by train.
  adapter_dir: ../output/adapter/${model.name}
  # Writable destination for this model's merged 16-bit model and tokenizer.
  merged_dir: ../output/merged/${model.name}

wandb:
  # W&B project name used for run metadata, training logs, and evaluation metrics.
  project: ilprl-tamang-translation
  # W&B user/team slug, or null to use the authenticated user's default entity.
  entity: null
  # W&B mode. Valid values: online (upload), offline (store locally), disabled (no W&B run).
  mode: online
  # Optional W&B grouping label for related runs.
  group: qwen3.5-4b-qlora

model:
  #Valid values: base (load `name` from Hugging Face) | merged (load local `model_path`).
  source: merged
  # Hugging Face model ID for base mode and the model label in logs/output filenames.
  # choices include : meta-llama/Llama-3.2-3B-Instruct
  # Qwen/Qwen3.5-4B
  # google/gemma-4-E4B
  # google/gemma-4-E4B-it
  # mistralai/Ministral-3-3B-Reasoning-2512
  # mistralai/Ministral-3-3B-Instruct-2512
  name: Qwen/Qwen3.5-4B
  # Local merged-model directory; automatically follows name and is ignored for source: base.
  model_path: ${run.merged_dir}
  quantization:
    # Whether evaluation passes a BitsAndBytes quantization configuration. Valid values: true, false.
    enabled: true
    # Whether that configuration loads 4-bit weights. Valid values: true, false; ignored if disabled.
    load_in_4bit: true
  # Whether the tokenizer chat template enables model thinking. Valid values: true, false.
  thinking: false
  # Positive maximum sequence length for Unsloth/SFT training; lower values reduce memory use.
  max_seq_length: 256

eval_data:
  dataset_name: ../dataset/eval_split.csv
  # Datasets split for a local CSV. Use train for this CSV builder configuration.
  split: train
  revision: main
  shuffle: false
  # Positive number of prompts generated together; lower it if GPU memory is exhausted.
  batch_size: 8
  # Writable directory for per-direction prediction CSVs and metric JSON files; runner.py creates it when needed.
  model_output: ../output/eval_results
  # Evaluation runs every direction below independently, producing one CSV, metric JSON,
  # local evaluation log, and W&B metric namespace per direction.
  directions:
    # Tamang to English mapping.
    - dataset_config: eval_split.csv
      source_column: translation_en
      target_column: translation_tmg
      source_language: English
      target_language: Tamang


train_data:
  # Training CSV. Every configured source_column and target_column must be an existing header.
  dataset_name: ../dataset/train_split.csv
  # Held-out validation CSV. It must have the same columns used by directions below;
  # the training loader applies these same direction mappings to this file.
  valid_name: ../dataset/valid_split.csv
  # Datasets split for a local CSV. Use train for this CSV builder configuration.
  split: train
  revision: null
  # Deterministically shuffle concatenated directions with run.seed. Valid values: true, false.
  shuffle: true

  directions:
    # Tamang to English mapping.
    - dataset_config: train_split.csv
      source_column: translation_tmg
      target_column: translation_en
      source_language: Tamang
      target_language: English

    # English to Tamang mapping.
    - dataset_config: train_split.csv
      source_column: translation_en
      target_column: translation_tmg
      source_language: English
      target_language: Tamang

    # Nepali to Tamang mapping.
    - dataset_config: train_split.csv
      source_column: relevant_sentences
      target_column: translation_tmg
      source_language: Nepali
      target_language: Tamang

    # Tamang to Nepali mapping.
    - dataset_config: train_split.csv
      source_column: translation_tmg
      target_column: relevant_sentences
      source_language: Tamang
      target_language: Nepali

    # English to Nepali mapping.
    - dataset_config: train_split.csv
      source_column: translation_en
      target_column: relevant_sentences
      source_language: English
      target_language: Nepali

    # Nepali to English mapping.
    - dataset_config: train_split.csv
      source_column: relevant_sentences
      target_column: translation_en
      source_language: Nepali
      target_language: English

prompt:
  # Evaluation strategy. Valid values: zero_shot, few_shot, rag_few_shot, cot_translation, back_translation.
  strategy: zero_shot
  examples:
    # Few-shot automatically selects this mapping from each evaluation row's language pair.
    # English to Nepali demonstrations.
    en_np:
      # Example source text.
      - source: Minister Bhusal, who remained anonymous for a long time while holding the Ministry of Agriculture, has claimed that he has succeeded in accomplishing historic work during this period.
        # Paired example target text.
        target: कृषि मन्त्रालय सम्हालेको लामो अवधिसम्म गुमनाम रहेका मन्त्री भुसालले यो अवधिमा आफूले ऐतिहासिक काम गर्न सफल भएको दाबी गरेका छन्।
      # Example source text.
      - source: This school is one of the oldest schools in the district.
        # Paired example target text.
        target: यो विद्यालय जिल्लाकै पुरानो विद्यालय मध्यको एक हो।
      # Example source text.
      - source: We are grateful to our viewers.
        # Paired example target text.
        target: हामी हजुर दर्शक श्रोताहरू प्रति कृतज्ञ छौँ।

    # English to Tamang demonstrations.
    en_tmg:
      # Example source text.
      - source: Minister Bhusal, who remained anonymous for a long time while holding the Ministry of Agriculture, has claimed that he has succeeded in accomplishing historic work during this period.
        # Paired example target text.
        target: सानाम ब्लोनखाङ किन्बा ह्रेङ्बा दुइदोःना गुमनाम मुबा ब्लोन भुसालसे चु दुइरि ह्राङसे दोङरापकि गे लाबारि स्हाङ्बा ताबा दाबी लाबा मुला।
      # Example source text.
      - source: This school is one of the oldest schools in the district.
        # Paired example target text.
        target: चु लोप्खाङ जोङ्लान खेःबा लोप्खाङ गुङ्ला गिक्खे हिन्ना।
      # Example source text.
      - source: We are grateful to our viewers.
        # Paired example target text.
        target: ङानि ए दर्शक श्रोताकादेथोरि कृतज्ञ मुला।

    # Nepali to English demonstrations.
    np_en:
      # Example source text.
      - source: कृषि मन्त्रालय सम्हालेको लामो अवधिसम्म गुमनाम रहेका मन्त्री भुसालले यो अवधिमा आफूले ऐतिहासिक काम गर्न सफल भएको दाबी गरेका छन्।
        # Paired example target text.
        target: Minister Bhusal, who remained anonymous for a long time while holding the Ministry of Agriculture, has claimed that he has succeeded in accomplishing historic work during this period.
      # Example source text.
      - source: यो विद्यालय जिल्लाकै पुरानो विद्यालय मध्यको एक हो।
        # Paired example target text.
        target: This school is one of the oldest schools in the district.
      # Example source text.
      - source: हामी हजुर दर्शक श्रोताहरू प्रति कृतज्ञ छौँ।
        # Paired example target text.
        target: We are grateful to our viewers.

    # Nepali to Tamang demonstrations.
    np_tmg:
      # Example source text.
      - source: कृषि मन्त्रालय सम्हालेको लामो अवधिसम्म गुमनाम रहेका मन्त्री भुसालले यो अवधिमा आफूले ऐतिहासिक काम गर्न सफल भएको दाबी गरेका छन्।
        # Paired example target text.
        target: सानाम ब्लोनखाङ किन्बा ह्रेङ्बा दुइदोःना गुमनाम मुबा ब्लोन भुसालसे चु दुइरि ह्राङसे दोङरापकि गे लाबारि स्हाङ्बा ताबा दाबी लाबा मुला।
      # Example source text.
      - source: यो विद्यालय जिल्लाकै पुरानो विद्यालय मध्यको एक हो।
        # Paired example target text.
        target: चु लोप्खाङ जोङ्लान खेःबा लोप्खाङ गुङ्ला गिक्खे हिन्ना।
      # Example source text.
