      # Example source text.
      - source: ङानि ए दर्शक श्रोताकादेथोरि कृतज्ञ मुला।
        # Paired example target text.
        target: हामी हजुर दर्शक श्रोताहरू प्रति कृतज्ञ छौँ।

    # Tamang to English demonstrations.
    tmg_en:
      # Example source text.
      - source: सानाम ब्लोनखाङ किन्बा ह्रेङ्बा दुइदोःना गुमनाम मुबा ब्लोन भुसालसे चु दुइरि ह्राङसे दोङरापकि गे लाबारि स्हाङ्बा ताबा दाबी लाबा मुला।
        # Paired example target text.
        target: Minister Bhusal, who remained anonymous for a long time while holding the Ministry of Agriculture, has claimed that he has succeeded in accomplishing historic work during this period.
      # Example source text.
