run:
  mode: evaluate                  # evaluate | train
  seed: 42
  output_dir: artifacts
  run_name: baseline_zero_shot

model:
  name: qwen2.5:7b                # ollama tag, e.g. model.name=llama3.1:8b or model.name=gemma4:4b

data:
  dataset_name: ai4bharat/IN22-Gen
  config_name: default
  split: test
  source_column: eng_Latn
  target_languages:
    - column: mai_Deva
      name: Maithili
    - column: npi_Deva
      name: Nepali
  max_samples: 50

prompt:
  strategy: zero_shot             # zero_shot | few_shot
  system_instruction: >
    You are an English-to-Nepali translator. Return only the Nepali translation,
    without explanation.
  user_template: >
    Translate the following English sentence into Nepali.

    {source}

training:
  enabled: false
  method: qlora
  train_split: train
  validation_split: validation
  output_dir: outputs/adapter
  learning_rate: 0.0002
  num_train_epochs: 3
  lora_rank: 16
  lora_alpha: 32
  lora_dropout: 0.05