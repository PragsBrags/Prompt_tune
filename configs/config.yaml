        # Paired example target text.
        target: This school is one of the oldest schools in the district.
      # Example source text.
      - source: ङानि ए दर्शक श्रोताकादेथोरि कृतज्ञ मुला।
        # Paired example target text.
        target: We are grateful to our viewers.

rag:
  # Persistent Chroma directory. Indexing and rag_few_shot evaluation must use exactly the same path.
  index_path: ../embeddging_index
  # Delete the named collection before indexing. Valid values: true, false; use true after corpus/model changes.
  rebuild: false
  embedding_model: sentence-transformers/all-MiniLM-L6-v2
  index_batch_size: 64
  top_k: 3
  candidate_k: 6
  # Persistent Chroma collection name. Indexing and retrieval must use the identical name.
  collection_name: translation_embeddings

training:
  method: qlora
  # Compute SFT loss only on assistant completion tokens. Valid values: true, false.
  completion_loss: true
  # SFTTrainer checkpoint/output directory; automatically follows name via run.adapter_dir.
  output_dir: ${run.adapter_dir}
  learning_rate: 0.0001
  num_train_epochs: 1
  lora_rank: 16
  lora_alpha: 32
  lora_dropout: 0.05
  batch_size: 2
  gradient_accumulation_steps: 4
  warmup_steps: 50
  logging_steps: 10
  eval_steps: 10
  # SFTConfig/Transformers optimizer. Common valid values: adamw_8bit, adamw_torch, adamw_torch_fused, paged_adamw_8bit.
  optim: adamw_8bit
