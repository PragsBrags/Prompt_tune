run:
  mode: evaluate                  # evaluate | train
  seed: 42
  output_dir: ../output/gguf_model/Gemma
  adapter_dir: ../output/adapter/Gemma
  merged_dir: ../output/merged/Gemma


model:
  source: merged                    # base | merged
  name: Qwen/Qwen3.5-4B
  model_path: ../output/merged/Gemma
  quantization:
    enabled: True
    load_in_4bit: True
  thinking: False
  max_seq_length: 256

eval_data:
  dataset_name: ../dataset/eval_split.csv
  split: train
  revision: main
  shuffle: False
  batch_size: 8

  directions:
  - dataset_config: eval_split.csv
    source_column: relevant_sentences
    target_column: translation_tmg
    source_language: Nepali
    target_language: Tamang

train_data:
  dataset_name: ../dataset/train_split.csv
  split: train
  revision: null
  shuffle: True
  max_samples: 

  directions:
    # Tamang to English
    - dataset_config: train_split.csv
      source_column: translation_tmg
      target_column: translation_en
      source_language: Tamang
      target_language: English

    # English to Tamang
    - dataset_config: train_split.csv
      source_column: translation_en
      target_column: translation_tmg
      source_language: English
      target_language: Tamang

    # Nepali to Tamang
    - dataset_config: train_split.csv
      source_column: relevant_sentences
      target_column: translation_tmg
      source_language: Nepali
      target_language: Tamang

    # Tamang to Nepali
    - dataset_config: train_split.csv
      source_column: translation_tmg
      target_column: relevant_sentences
      source_language: Tamang
      target_language: Nepali


prompt:
  strategy: zero_shot             # zero_shot | few_shot
  system_instruction: >
    You are an English-to-Nepali translator. Return only the Nepali translation,
    without explanation.
  user_template: >
    Translate the following English sentence into Nepali.

    {source}

training:
  method: qlora
  completion_loss: True
  output_dir: ../output/adapter/Qwen
  learning_rate: 0.0001
  num_train_epochs: 1
  lora_rank: 16
  lora_alpha: 32
  lora_dropout: 0.05
  batch_size: 2
  gradient_accumulation_steps: 4
  warmup_steps: 50
  logging_steps: 10
  optim: adamw_8bit
